    <script>
      // iPhone: al cerrar el teclado Safari deja la página corrida y los toques no le apuntan a los botones.
      document.addEventListener('focusout', function () {
        setTimeout(function () {
          var a = document.activeElement;
          if (!a || (a.tagName !== 'INPUT' && a.tagName !== 'TEXTAREA')) window.scrollTo(0, 0);
        }, 80);
      });

      // iPhone: sin esto Safari cree que los campos son de tarjeta de crédito (sugiere la Visa) y apaga
      // el autocorrector. Marcamos cada campo: texto con autocorrector, números sin autocompletar.
      (function () {
        function arreglar(el) {
          if (el.dataset.ok) return;
          el.dataset.ok = '1';
          // Safari no ofrece Autorrelleno (tarjetas, contactos) en campos que se llaman "search".
          var id = 'search-' + Math.random().toString(36).slice(2, 8);
          el.setAttribute('autocomplete', 'off');
          el.setAttribute('name', id);
          if (!el.id) el.id = id;
          el.setAttribute('aria-autocomplete', 'none');
          el.setAttribute('data-form-type', 'other');
          var numerico = /decimal|numeric|tel/.test(el.getAttribute('inputmode') || '') || el.type === 'number';
          if (numerico) {
            el.setAttribute('autocorrect', 'off');
            el.setAttribute('spellcheck', 'false');
          } else {
            el.setAttribute('autocorrect', 'on');
            el.setAttribute('spellcheck', 'true');
            el.setAttribute('autocapitalize', 'sentences');
          }
        }
        function revisar() {
          document.querySelectorAll('input:not([data-ok]), textarea:not([data-ok])').forEach(arreglar);
        }
        new MutationObserver(revisar).observe(document.documentElement, { childList: true, subtree: true });
        document.addEventListener('focusin', function (e) {
          var t = e.target;
          if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) arreglar(t);
        });
      })();
    </script>
